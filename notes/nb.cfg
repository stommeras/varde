; The notes in Norwegian bokmål. See Notes for how the writer fills them.
; A template's slots are {direction}, a compass word, and {feature} and {the_feature}, the
; indefinite and definite form of the noun for the feature it names. Start no template with a
; slot, since the writer doesn't capitalize.

[varde]

opening="Ei gammel varde. Under den øverste steinen ligger en lapp:\n\n"

[compass]

words=["nord", "nordøst", "øst", "sørøst", "sør", "sørvest", "vest", "nordvest"]

[nouns]

lake=["et vann", "vannet"]
tarn=["et tjern", "tjernet"]
river=["ei elv", "elva"]
brook=["en bekk", "bekken"]
fork=["et samløp", "samløpet"]
cove=["ei vik", "vika"]
forest=["en skog", "skogen"]

[templates]

wreck=["Skipsloggen, siste side:\n\nFra dekk så vi gamle varder oppover fjellene inne på øya. Noen har gått der før oss."]
summit=["Ingen topp på øya står høyere enn denne. Toppvarden står like over oss."]
higher=["Fra denne toppen så vi en høyere mot {direction}."]
lake=["Fra denne toppen så vi en høyere mot {direction}, med {feature} ved foten.", "Mot {direction} står en høyere topp. Under den ligger {the_feature}."]
river=["Fra denne toppen så vi en høyere mot {direction}. Fra den renner {feature} ned.", "Mot {direction} står en høyere topp. Følg {the_feature} opp dit."]
fork=["Fra denne toppen så vi en høyere mot {direction}. Under den møtes to elver.", "Mot {direction} står en høyere topp, over {the_feature} der to elver blir til én."]
cove=["Fra denne toppen så vi en høyere mot {direction}, over {feature} ved sjøen.", "Mot {direction} står en høyere topp. Den reiser seg over {the_feature}."]
forest=["Fra denne toppen så vi en høyere mot {direction}, ved {feature}.", "Mot {direction} står en høyere topp. Ved foten av den ligger {the_feature}."]
