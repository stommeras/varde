# Deploys varde.tommeras.no: the landing page from main around the web build of the latest release.
# A push to main that changes the page deploys it without a release, and release.yml runs this
# after it publishes, so the game on the site changes only with a version tag.
name: site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_call:
  workflow_dispatch:

# Two deploys at once could finish in either order, so the later one waits.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Called from release.yml the checkout would default to the tag, so name main.
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Put the site together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --pattern varde-web.zip
          mkdir -p build/site/spill
          unzip -q varde-web.zip -d build/site/spill
          cp site/index.html site/vercel.json game/backdrop.png build/site/
      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@65.1.0 deploy build/site --prod --yes --token "$VERCEL_TOKEN"
